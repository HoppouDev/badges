# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# `prek install` sets up both shims
default_install_hook_types = ["pre-commit", "prepare-commit-msg"]

# Vendored fonts and icons and upstream reference renders stay byte-for-byte
exclude = { glob = ["backend/assets/**", "backend/tests/fixtures/**"] }

# Hooks sharing a priority run in parallel. Whitespace fixes land before the
# formatters so nothing edits a file twice at once, and clippy checks the
# formatted result
[priorities]
fix = 0
format = 10
lint = 20

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = "fix" },
  { id = "end-of-file-fixer", priority = "fix" },
  { id = "check-added-large-files", priority = "fix" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "tombi-format"
name = "tombi format"
entry = "tombi format"
language = "system"
files = { glob = "**/*.toml" }
priority = "format"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
files = { glob = "**/*.rs" }
pass_filenames = false
priority = "format"

# ESLint lints and formats JS, TS and Svelte; see frontend/eslint.config.js
[[repos.hooks]]
id = "eslint"
name = "eslint --fix"
entry = 'cd frontend && ./node_modules/.bin/eslint --fix "${@#frontend/}"'
shell = "bash"
language = "system"
files = { glob = "frontend/**/*.{js,ts,svelte}" }
priority = "format"

# Biome comes from the frontend's devDependencies (`pnpm install` in
# frontend/) and formats and lints JSON, CSS and HTML; see biome.json
[[repos.hooks]]
id = "biome"
name = "biome check"
entry = "frontend/node_modules/.bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true"
language = "system"
files = { glob = ["**/*.{json,jsonc,css,html}"] }
priority = "format"

# Lints Markdown and rewraps paragraphs to 100 columns; see .rumdl.toml
[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "rumdl check --fix"
language = "system"
files = { glob = "**/*.md" }
priority = "format"

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
files = { glob = "**/*.rs" }
pass_filenames = false
priority = "lint"

# Prompts for a conventional commit on `git commit` without a conventional
# `-m`. prek captures hook output, so koji talks to the terminal directly,
# and is skipped when there is none
[[repos.hooks]]
id = "koji"
name = "koji"
entry = "if { exec 3<> /dev/tty; } 2> /dev/null; then koji --hook <&3 >&3 2>&3 || true; fi"
shell = "bash"
language = "system"
stages = ["prepare-commit-msg"]
always_run = true
pass_filenames = false
