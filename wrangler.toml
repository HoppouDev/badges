name = "badges"
main = "build/index.js"
compatibility_date = "2026-09-26"

[build]
command = "cargo install -q --locked \"worker-build@=0.8.7\" && worker-build --release --panic-unwind"

# Hosts allowed for icon=https://... (comma-separated; empty disables remote icons).
# Unset uses DEFAULT_ICON_HOSTS in src/icon.rs.
# [vars]
# ICON_HOSTS = "raw.githubusercontent.com,cdn.jsdelivr.net"

# /ci badges read GitHub Actions runs with the GITHUB_TOKEN secret and answer
# 503 without it. Only public repositories are served, whatever the token sees:
#   npx wrangler secret put GITHUB_TOKEN
