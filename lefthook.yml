---
pre-commit:
  parallel: true
  commands:
    tombi-format:
      glob: "*.toml"
      run: tombi format
      stage_fixed: true

    cargo-fmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true

    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings

    prettier:
      glob: "*.{md,yml,yaml,json}"
      exclude:
        - "frontend/**"
      run: npx --yes prettier@3 --write {staged_files}
      stage_fixed: true

    prettier-frontend:
      root: frontend/
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
